name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be run from main (selected ref: ${GITHUB_REF})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          npm version "$INCREMENT" --message "%s" --tag-version-prefix=v
          version="$(npm pkg get version | tr -d '"')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: npm run build

      - name: Push version commit and tag
        id: push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "$TAG"

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

      - name: Dispatch deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run deploy.yml --ref "$TAG"

      - name: Summarize release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          deployment_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml?query=event%3Aworkflow_dispatch+branch%3A${TAG}"
          {
            echo "## Release ${TAG} published"
            echo
            echo "- Version: ${VERSION}"
            echo "- Release: [${TAG}](${release_url})"
            echo "- Deployment: [deploy.yml run for ${TAG}](${deployment_url})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize post-push failure
        if: always() && steps.push.outcome == 'success' && steps.deploy.outcome != 'success'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Release ${TAG} incomplete"
            echo
            if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
              echo "The version commit, tag, and release are published, but the deployment was not dispatched."
              echo
              echo "Retry with: \`gh workflow run deploy.yml --ref ${TAG}\`"
            else
              echo "The version commit and tag are pushed, but the release was not published."
              echo
              echo "Retry with: \`gh release create ${TAG} --verify-tag --generate-notes --title ${TAG}\`"
            fi
            echo
            echo "No remote reference was removed."
          } >> "$GITHUB_STEP_SUMMARY"
