name: Deploy to GitHub Pages

on:
  # Deploy the version attached to a published release.
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Never interrupt a deployment or let two deployments run at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

# No job receives default permissions; each job declares its own.
permissions: {}

jobs:
  build:
    permissions:
      contents: read # Check out the repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    permissions:
      pages: write # Create the Pages deployment
      id-token: write # Request the OIDC token required by Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
